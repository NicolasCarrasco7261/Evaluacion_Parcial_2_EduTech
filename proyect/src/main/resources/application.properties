# Nombre del proyecto (aparece en Swagger UI)
spring.application.name=proyect

# Parámetros de la conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_edutech?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuración de logs SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / Springdoc OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html